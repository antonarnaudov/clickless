# Builds the macOS app on GitHub's machines from the tagged source and attaches it to a DRAFT
# release. Nothing is public until a maintainer presses "Publish" on GitHub. Builds are never
# uploaded from a personal computer, so no local data can end up in a download.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, e.g. v0.1.0
        required: true
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build Clickless.app (Apple silicon + Intel), DMG and ZIP
        run: npm run dist:release
      - name: Checksums
        run: |
          cd release
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Clickless ${TAG#v}" --notes-file docs/RELEASE-NOTES.md
          gh release upload "$TAG" release/*.dmg release/*.zip release/SHA256SUMS.txt --clobber
